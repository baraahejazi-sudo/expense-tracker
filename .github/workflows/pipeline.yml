name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  ARTIFACT_NAME: expense-tracker-release

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build:
    name: Build release package
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Assemble deployable package
        run: |
          mkdir -p release/backend release/frontend
          cp -R backend/app release/backend/app
          cp backend/requirements.txt release/backend/requirements.txt
          cp -R frontend/dist/. release/frontend/
          cp README.md release/README.md
          python -m zipfile -c "${ARTIFACT_NAME}.zip" release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build

      - name: Validate deployment secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN is not configured for the production environment."
            exit 1
          fi
          echo "DEPLOY_TOKEN is configured (length: ${#DEPLOY_TOKEN})."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            "build/${ARTIFACT_NAME}.zip" \
            --repo "${{ github.repository }}" \
            --title "Expense Tracker $TAG" \
            --notes "Automated deployment to ${DEPLOY_TARGET:-production} from commit ${{ github.sha }}."
